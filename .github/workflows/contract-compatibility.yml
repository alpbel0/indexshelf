name: Contract Compatibility

on:
  pull_request:
  push:
    branches: [main]

jobs:
  compatibility:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.8.14"
          enable-cache: true
          cache-dependency-glob: contracts/uv.lock
      - run: npm ci
      - run: uv sync --locked
      - run: ./scripts/compatibility.sh
