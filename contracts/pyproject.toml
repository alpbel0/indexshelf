[project]
name = "indexshelf-contracts"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "jsonschema==4.23.0",
    "pydantic==2.10.6",
]

[dependency-groups]
dev = [
    "pytest==8.3.5",
    "ruff==0.11.2",
    "mypy==1.15.0",
    "datamodel-code-generator==0.76.2",
]

[tool.pytest.ini_options]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"
